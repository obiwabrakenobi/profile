languageCode: en-us
title: Emil
theme: PaperMod
enableEmoji: true


params:
  disableThemeToggle: true
  hideFooter: true
  profileMode:
    enabled: true
    title: "<Title>" # optional default will be site title
    subtitle: "Loving husband :heart: and master yoda of software"
    imageUrl: "images/IMG_9524.png" # optional
    imageWidth: 120 # custom size
    imageHeight: 120 # custom size
  socialIcons:
    - name: "Github"
      url: "https://github.com/obiwabrakenobi"

caches:
  images:
    dir: :cacheDir/images

imaging:
  compression: lossless
  quality: 100
  resampleFilter: lanczos

